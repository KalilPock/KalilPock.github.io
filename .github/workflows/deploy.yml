name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "deploy/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Opcional: só funciona se o runner alcançar o Pi-hole
          # (ex.: self-hosted runner na LAN). Sem isso, o JSON commitado é usado.
          PIHOLE_URL: ${{ secrets.PIHOLE_URL }}
          PIHOLE_API_KEY: ${{ secrets.PIHOLE_API_KEY }}
          PIHOLE_SHOW_DOMAINS: ${{ vars.PIHOLE_SHOW_DOMAINS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
